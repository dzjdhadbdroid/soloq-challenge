name: update-ranking

on:
  schedule:
    - cron: "*/20 * * * *"   # toutes les 20 minutes
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update.py
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      - name: Commit des nouvelles données
        run: |
          git config user.name "soloq-bot"
          git config user.email "soloq-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "maj classement" && git push)
