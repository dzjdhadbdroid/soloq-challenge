<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Roue · SoloQ Challenge</title>
<meta name="description" content="Tire au sort un champion et un rôle League of Legends au hasard.">
<meta name="theme-color" content="#5c1a33">
<meta property="og:type" content="website"><meta property="og:title" content="La Roue · SoloQ Challenge"><meta property="og:description" content="Tire au sort un champion et un rôle League of Legends au hasard.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#0e141e;--card:#162030;--card2:#1b2a40;--line:#233248;--txt:#e8eef7;--mut:#8394ab;--win:#3b82f6;--loss:#ef4444;--gold:#f5c542;--up:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 340px at 50% -120px,rgba(245,197,66,.13),transparent 70%),var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
header{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}.logo b{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:8px 14px;border-radius:8px;font-size:14px}
nav a.on,nav a:hover{background:var(--card);color:var(--txt)}
.wrap{max-width:1208px;margin:0 auto;padding:0 16px 60px}
.wheels{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:34px;align-items:start;margin-top:34px}
.wbox{text-align:center}
.wbox h3{font-family:var(--hf);font-size:22px;letter-spacing:1px;text-transform:uppercase;margin:0 0 14px;color:var(--txt)}
.wheel{position:relative;width:min(100%,520px);aspect-ratio:1;margin:0 auto}
.wheel.small{width:min(100%,340px)}
.wheel canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 14px 40px rgba(61,18,32,.25);transition:transform 6s cubic-bezier(.12,.62,.1,1)}
.wheel .pin{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid var(--gold2);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:3}
.wheel .hub{position:absolute;left:50%;top:50%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:4px solid var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;z-index:2;overflow:hidden}
.wheel .hub img{width:46%;border-radius:50%;margin-bottom:4px}
.wheel .hub b{font-family:var(--hf);font-size:clamp(14px,3.2vw,24px);line-height:1;text-transform:uppercase;color:var(--txt);word-break:break-word}
.wheel .hub span{font-size:11px;color:var(--mut)}
.go{display:block;margin:32px auto 0;background:var(--wb);color:#fff;border:0;border-radius:3px;padding:16px 46px;font:800 16px/1 'DM Sans',system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 -3px 0 var(--gold2)}
.go:hover{filter:brightness(1.15)}.go:disabled{opacity:.6;cursor:wait}
.result{margin:34px auto 0;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px;display:flex;gap:18px;align-items:center;min-height:116px}
.result img{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold2);flex:none;background:var(--card2)}
.result .nm{font-family:var(--hf);font-size:38px;font-weight:800;text-transform:uppercase;line-height:1;color:var(--txt)}
.result .rl{display:inline-block;margin-top:8px;background:var(--wb);color:#fff;border-radius:3px;padding:5px 12px;font:700 12px 'DM Sans',sans-serif;letter-spacing:1px;text-transform:uppercase}
.result .empty{color:var(--mut);font-size:14px}
.hist{max-width:560px;margin:26px auto 0}
.hist h4{font-family:var(--hf);font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 10px}
.hist li img{width:28px;height:28px;border-radius:50%}
.hist li em{margin-left:auto;font-style:normal;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.err{text-align:center;color:var(--loss);margin-top:30px}
@media(max-width:820px){.wheels{grid-template-columns:minmax(0,1fr);gap:40px}.result .nm{font-size:30px}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=1793380056"><script src="theme.js?v=1793365394"></script>
</head>
<body>
<header>
  <div class="logo">SoloQ<b>Challenge</b></div>
  <nav><a href="index.html">Classement</a><a href="stats.html">Statistiques</a><a class="on" href="roue.html">Roue</a></nav>
</header>

<div class="hero">
  <h1>La <em>Roue</em></h1>
  <p>Un champion au hasard, un rôle au hasard. À toi de le jouer en solo/duo !</p>
</div>

<div class="wrap">
  <div class="wheels">
    <div class="wbox">
      <h3>Champion</h3>
      <div class="wheel" id="wc"><div class="pin"></div><canvas id="cc" width="1000" height="1000"></canvas>
        <div class="hub"><b id="hubc">?</b><span id="hubn"></span></div></div>
    </div>
    <div class="wbox">
      <h3>Rôle</h3>
      <div class="wheel small" id="wr"><div class="pin"></div><canvas id="cr" width="800" height="800"></canvas>
        <div class="hub"><b id="hubr">?</b></div></div>
    </div>
  </div>

  <button class="go" id="go" disabled>Chargement…</button>
  <div class="result" id="res"><div class="empty">Appuie sur « Tourner » pour tirer ton champion et ton rôle.</div></div>
  <div class="hist" id="hist" hidden><h4>Derniers tirages</h4><ul id="hl"></ul></div>
  <div class="err" id="err" hidden></div>
</div>

<script>
var ROLES = ["Top", "Jungle", "Mid", "ADC", "Support"];
var COLS = ["#641d32", "#a0701f", "#85334b", "#e0b66c"];
var DD = {ver: "", list: []}, ROT = {c: 0, r: 0}, BUSY = false, HIST = [];
var $ = function(id){ return document.getElementById(id); };

function ang(el){
  var m = getComputedStyle(el).transform;
  if(!m || m === "none") return 0;
  var v = m.match(/matrix\(([^)]+)\)/); if(!v) return 0;
  var p = v[1].split(",").map(Number);
  return Math.atan2(p[1], p[0]) * 180 / Math.PI;
}
function idxAt(el, n){
  var r = ang(el), a = 360 / n;
  return Math.floor((((-r) % 360) + 360) % 360 / a) % n;
}
function drawWheel(cv, labels, withText){
  var c = cv.getContext("2d"), S = cv.width, R = S / 2, n = labels.length, a = 2 * Math.PI / n;
  c.clearRect(0, 0, S, S);
  for(var i = 0; i < n; i++){
    var col = COLS[i % COLS.length];
    if(i === n - 1 && n % COLS.length === 1) col = COLS[2];
    c.beginPath(); c.moveTo(R, R);
    c.arc(R, R, R - 4, -Math.PI / 2 + i * a, -Math.PI / 2 + (i + 1) * a); c.closePath();
    c.fillStyle = col; c.fill();
    if(withText){
      c.save(); c.translate(R, R); c.rotate(-Math.PI / 2 + (i + .5) * a);
      c.textAlign = "right"; c.textBaseline = "middle";
      c.fillStyle = col === "#e0b66c" ? "#2b1119" : "#fff";
      c.font = "800 " + Math.round(S / 19) + "px 'Barlow Condensed', 'DM Sans', sans-serif";
      c.fillText(labels[i].toUpperCase(), R - 34, 0); c.restore();
    }
  }
  c.beginPath(); c.arc(R, R, R - 4, 0, 2 * Math.PI); c.lineWidth = 8; c.strokeStyle = "#e0b66c"; c.stroke();
}
function iconUrl(ch){ return "https://ddragon.leagueoflegends.com/cdn/" + DD.ver + "/img/champion/" + ch.id + ".png"; }

function init(){
  drawWheel($("cr"), ROLES, true);
  fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(function(r){ return r.json(); }).then(function(v){
    DD.ver = v[0];
    return fetch("https://ddragon.leagueoflegends.com/cdn/" + DD.ver + "/data/fr_FR/champion.json");
  }).then(function(r){ return r.json(); }).then(function(j){
    DD.list = Object.keys(j.data).map(function(k){ return {id: j.data[k].id, name: j.data[k].name}; })
      .sort(function(a, b){ return a.name.localeCompare(b.name, "fr"); });
    drawWheel($("cc"), DD.list.map(function(c){ return c.name; }), false);
    $("hubn").textContent = DD.list.length + " champions";
    $("go").disabled = false; $("go").textContent = "Tourner la roue";
  }).catch(function(){
    $("go").textContent = "Indisponible";
    var e = $("err"); e.hidden = false; e.textContent = "Impossible de charger la liste des champions pour le moment. Recharge la page dans un instant.";
  });
}

function spin(){
  if(BUSY || !DD.list.length) return;
  BUSY = true; $("go").disabled = true;
  var nc = DD.list.length, nr = ROLES.length;
  var ic = Math.floor(Math.random() * nc), ir = Math.floor(Math.random() * nr);
  function target(cur, i, n){
    var a = 360 / n, f = .12 + Math.random() * .76;
    var want = ((-(i + f) * a) % 360 + 360) % 360, have = ((cur % 360) + 360) % 360;
    return cur + 360 * (5 + Math.floor(Math.random() * 3)) + ((want - have + 360) % 360);
  }
  ROT.c = target(ROT.c, ic, nc); ROT.r = target(ROT.r, ir, nr);
  var cc = $("cc"), cr = $("cr");
  cc.style.transform = "rotate(" + ROT.c + "deg)";
  cr.style.transform = "rotate(" + ROT.r + "deg)";
  $("res").innerHTML = '<div class="empty">La roue tourne…</div>';
  var live = setInterval(function(){
    $("hubc").textContent = DD.list[idxAt(cc, nc)].name;
    $("hubr").textContent = ROLES[idxAt(cr, nr)];
  }, 60);
  setTimeout(function(){
    clearInterval(live);
    var ch = DD.list[ic], role = ROLES[ir];
    $("hubc").textContent = ch.name; $("hubr").textContent = role;
    $("res").innerHTML = '<img alt="" src="' + iconUrl(ch) + '"><div><div class="nm"></div><span class="rl"></span></div>';
    $("res").querySelector(".nm").textContent = ch.name; $("res").querySelector(".rl").textContent = role;
    HIST.unshift({ch: ch, role: role}); HIST = HIST.slice(0, 8);
    $("hist").hidden = false; var ul = $("hl"); ul.innerHTML = "";
    HIST.forEach(function(h){
      var li = document.createElement("li"), im = document.createElement("img"), sp = document.createElement("span"), em = document.createElement("em");
      im.alt = ""; im.src = iconUrl(h.ch); sp.textContent = h.ch.name; em.textContent = h.role;
      li.appendChild(im); li.appendChild(sp); li.appendChild(em); ul.appendChild(li);
    });
    BUSY = false; $("go").disabled = false; $("go").textContent = "Retourner la roue";
  }, 6200);
}
$("go").addEventListener("click", spin);
init();
</script>
<script src="admin.js?v=1793353903"></script>
</body>
</html>
