<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoloQ Challenge</title>
<style>
:root{color-scheme:dark;--bg:#0e141e;--card:#162030;--line:#233248;--txt:#e8eef7;--mut:#8394ab;--win:#3b82f6;--loss:#ef4444;--gold:#f5c542;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}.logo b{color:var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:8px 14px;border-radius:8px;font-size:14px}
nav a.on,nav a:hover{background:var(--card);color:var(--txt)}
.hero{text-align:center;padding:36px 16px 20px}
.hero h1{margin:0 0 8px;font-size:34px}
.hero p{margin:0;color:var(--mut)}
.pill{display:inline-block;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font-size:14px}
.pill b{color:var(--gold)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 48px}
.bar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 14px;font-size:14px}
.bar select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px}
.note{background:#2a2410;border:1px solid #5b4a14;color:#f1d98a;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.warn{background:#2a1416;border:1px solid #6b2328;color:#ffb4b8;border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:8px 10px}
td{padding:10px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
tbody tr{background:var(--card)}tbody tr:hover{background:#1c2a3f}
.rk{font-weight:800;font-size:18px;width:44px;text-align:center}
tr:nth-child(1) .rk{color:var(--gold)}
.pl b{display:block;font-size:15px}.pl a{color:var(--mut);font-size:12px;text-decoration:none}.pl a:hover{color:var(--txt)}
.elo{display:flex;align-items:center;gap:10px}
.badge{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0b1220;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset}
.embw{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.emb{width:52px;height:52px;object-fit:contain}
.dv{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;font-weight:800;line-height:16px;color:var(--txt)}
.pl b a.live{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;letter-spacing:.5px;color:#86efac;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.5);border-radius:99px;padding:2px 9px;text-decoration:none;vertical-align:middle}
.pl b a.live:hover{background:rgba(34,197,94,.28);color:#bbf7d0}
.pl b a.live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.lp{font-weight:700}.lp small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.wr{font-weight:700}.v{color:var(--win)}.d{color:var(--loss)}
.last{display:flex;gap:3px}
.ch{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;background:#0b1220;border:3px solid var(--line);overflow:hidden}.ch img{width:100%;height:100%;object-fit:cover;display:block}
.ch.w{border-color:var(--win);color:#9ec5ff}.ch.l{border-color:var(--loss);color:#ffa3a3}
.empty{padding:30px;text-align:center;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin:0 0 8px}
tbody tr.clk{cursor:pointer}tbody tr.clk:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.modal{position:fixed;inset:0;background:rgba(3,7,14,.74);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(780px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.dh h2{margin:0;font-size:21px}.dh small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.x{margin-left:auto;align-self:flex-start;background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer}
.x:hover{background:#1c2a3f}
.sum{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 12px;font-size:13px;color:var(--mut)}
.sum b{display:block;color:var(--txt);font-size:19px;margin-top:2px}
.tip{min-height:20px;font-size:14px;color:var(--txt);margin-bottom:4px}
svg.chart{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.note2{color:var(--mut);font-size:13px;margin:10px 0 0}
.up{color:#4ade80}.dn{color:var(--loss)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
@media(max-width:640px){.hero h1{font-size:26px}header{padding:12px 14px}}
.pw{display:flex;align-items:center;gap:12px}
.pav{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:hsl(var(--h) 55% 36%);border:2px solid hsl(var(--h) 55% 52%)}
.pav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

.last{flex-wrap:wrap}
@media(max-width:1060px){
  .scroll{overflow-x:visible}
  table{min-width:0;display:block}
  thead{display:none}
  tbody{display:grid;gap:10px}
  tbody tr{display:grid;grid-template-columns:40px repeat(4,1fr);align-items:center;gap:10px 8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
  td{display:block;border:0;padding:0}
  td:nth-child(1){grid-column:1;grid-row:1}
  td:nth-child(2){grid-column:2 / 4;grid-row:1;min-width:0}
  td:nth-child(3){grid-column:4 / 6;grid-row:1}
  td:nth-child(4){grid-column:2;grid-row:2}td:nth-child(5){grid-column:3;grid-row:2}
  td:nth-child(6){grid-column:4;grid-row:2}td:nth-child(7){grid-column:5;grid-row:2}
  td:nth-child(8){grid-column:1 / -1;grid-row:3}
  td.wr:before{font-weight:400}
  td[data-l]:before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  .pl b{white-space:normal}
}
@media(max-width:560px){
  tbody tr{grid-template-columns:repeat(4,1fr)}
  td:nth-child(1){grid-column:1;grid-row:1}
  td:nth-child(2){grid-column:2 / 5;grid-row:1}
  td:nth-child(3){grid-column:1 / 5;grid-row:2}
  td:nth-child(4){grid-column:1;grid-row:3}td:nth-child(5){grid-column:2;grid-row:3}
  td:nth-child(6){grid-column:3;grid-row:3}td:nth-child(7){grid-column:4;grid-row:3}
  td:nth-child(8){grid-column:1 / -1;grid-row:4}
  .ch{width:30px;height:30px}
}
</style>
<link rel="stylesheet" href="theme.css"><script src="theme.js"></script>
</head>
<body>
<header>
  <div class="logo">SoloQ<b>Challenge</b></div>
  <nav><a class="on" href="index.html">Classement</a><a href="stats.html">Statistiques</a></nav>
</header>

<div class="hero">
  <h1>Le SoloQ Challenge</h1>
  <p>Un mois de classées. Le plus haut rank gagne.</p>
  <div class="pill">Du <b id="d1"></b> au <b id="d2"></b> · <span id="left"></span></div>
</div>

<div class="wrap">
  <div class="note">Chargement du classement…</div>
  <div class="warn" id="warn" hidden></div>
  <div class="bar">
    <input id="q" placeholder="Rechercher un joueur…">
    <select id="sort">
      <option value="elo">Trier par elo</option>
      <option value="games">Matchs joués</option>
      <option value="wr">Winrate</option>
      <option value="wins">Victoires</option>
    </select>
  </div>
  <p class="hint">Clique sur un joueur pour voir l'évolution de ses LP.</p>
  <div class="scroll">
  <table>
    <thead><tr><th>#</th><th>Joueur</th><th>Elo</th><th>Matchs</th><th>Victoires</th><th>Défaites</th><th>Winrate</th><th>10 dernières parties</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <div id="none" class="empty" hidden>Aucun joueur trouvé.</div>
</div>


<div class="modal" id="modal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="dh"><div id="mem"></div><div><h2 id="mt"></h2><small id="ms"></small></div>
      <button class="x" id="mx" aria-label="Fermer">×</button></div>
    <div class="sum" id="msum"></div>
    <div id="mtip" class="tip">&nbsp;</div>
    <div id="mchart"></div>
    <p class="note2" id="mnote"></p>
  </div>
</div>

<script>
// ====== CONFIG ======
var START = "2026-10-22", END = "2026-11-22";
// last10 : "W" victoire / "L" défaite, de la plus récente à la plus ancienne
// champs : champions joués, dans le même ordre
var PLAYERS = [];  // rempli depuis data/ranking.json
// Icônes de champions (image en base64). Ajoute une ligne par champion : Nom:"data:image/png;base64,..."
var ICONS = {};
// ====== FIN CONFIG ======

var TIERS = ["IRON","BRONZE","SILVER","GOLD","PLATINUM","EMERALD","DIAMOND","MASTER","GRANDMASTER","CHALLENGER"];
var COL = {IRON:"#7b6f6a",BRONZE:"#b8794a",SILVER:"#b9c4d0",GOLD:"#f5c542",PLATINUM:"#4fd1c5",EMERALD:"#34d399",DIAMOND:"#7aa7ff",MASTER:"#c084fc",GRANDMASTER:"#f87171",CHALLENGER:"#fde68a"};
var LBL = {IRON:"Fer",BRONZE:"Bronze",SILVER:"Argent",GOLD:"Or",PLATINUM:"Platine",EMERALD:"Émeraude",DIAMOND:"Diamant",MASTER:"Maître",GRANDMASTER:"GM",CHALLENGER:"Chall"};
var ROM = ["","I","II","III","IV"];


// Icônes de TOUS les champions via Data Dragon (CDN officiel de Riot).
// Fonctionne quand la page est hébergée sur ton site ou ouverte en fichier ; sinon on retombe sur ICONS puis sur les lettres.
var DD = {ver:null, map:null};
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,"")}
function iconSrc(c){
  if(ICONS[c]) return ICONS[c];
  if(DD.map){var id = DD.map[norm(c)]; if(id) return "https://ddragon.leagueoflegends.com/cdn/"+DD.ver+"/img/champion/"+id+".png";}
  return null;
}
function loadDD(){
  fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(function(r){return r.json()}).then(function(v){
    DD.ver = v[0];
    return fetch("https://ddragon.leagueoflegends.com/cdn/"+DD.ver+"/data/en_US/champion.json");
  }).then(function(r){return r.json()}).then(function(j){
    DD.map = {};
    Object.keys(j.data).forEach(function(id){DD.map[norm(id)] = id; DD.map[norm(j.data[id].name)] = id;});
    render();
  }).catch(function(){});
}

function loadData(){
  var n = document.querySelector(".note");
  fetch("data/ranking.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    PLAYERS = d.players || [];
    if(d.start && d.end && (d.start !== START || d.end !== END)){ START = d.start; END = d.end; setDates(); }
    if(n){
      var m = Math.max(0, Math.round((Date.now()/1000 - d.updated)/60));
      n.textContent = "Actualisé " + (m < 1 ? "à l'instant" : m < 60 ? "il y a " + m + " min" : "le " + new Date(d.updated*1000).toLocaleString("fr-FR")) + " · classement solo/duo EUW";
    }
    var msgs = [];
    if(d.key_ok === false) msgs.push("La clé Riot est refusée (expirée ?) : le classement n'est plus mis à jour.");
    (d.errors || []).forEach(function(e){ msgs.push(e.riot + " : " + e.msg); });
    var w = document.getElementById("warn");
    if(w){ w.innerHTML = msgs.map(esc).join("<br>"); w.hidden = !msgs.length; }
    render();
  }).catch(function(){ if(n) n.textContent = "Impossible de charger le classement pour le moment."; render(); });
}

function score(p){
  var t = TIERS.indexOf(p.tier);
  return t >= 7 ? 2800 + (t-7)*0 + p.lp + (t-7)*5000 : t*400 + (4-p.div)*100 + p.lp;
}
var CD = "https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/";
function embUrls(t){
  t = t.toLowerCase();
  return [CD+"ranked-mini-crests/"+t+".png", CD+"ranked-mini-crests/"+t+".svg", CD+"ranked-emblem/emblem-"+t+".png", "ranks/"+t+".png"];
}
function embErr(img){
  var u = JSON.parse(img.dataset.u), i = +img.dataset.i + 1;
  if(i < u.length){ img.dataset.i = i; img.src = u[i]; }
  else { img.parentNode.innerHTML = img.dataset.fb; }
}
function emblem(p,hi){
  if(p.unranked) return '<div class="embw"><div class="badge" style="background:#475569">?</div></div>';
  var fb = '<div class="badge" style="background:'+COL[p.tier]+'">'+esc(p.tier.slice(0,1))+(hi?"":ROM[p.div])+'</div>';
  var u = embUrls(p.tier);
  return '<div class="embw"><img class="emb" alt="'+esc(p.tier)+'" src="'+u[0]+'" data-i="0" data-u="'+esc(JSON.stringify(u))+'" data-fb="'+esc(fb)+'" onerror="embErr(this)">'
    + (hi ? '' : '<span class="dv">'+ROM[p.div]+'</span>') + '</div>';
}
var LIVE = {players:{}};
function liveTag(p){
  var g = LIVE.players && LIVE.players[p.riot];
  return g ? ' <a class="live" href="game.html?g='+encodeURIComponent(g)+'" title="Voir la partie en cours"><i></i>EN JEU</a>' : '';
}
function loadLive(){
  fetch("data/live.json?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){LIVE=d;render()}).catch(function(){});
}
function games(p){return p.w+p.l}
function wr(p){return games(p) ? Math.round(p.w/games(p)*100) : 0}
function fmt(s){var a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0].slice(2)}
function opgg(r){var a=r.split("#");return "https://dpm.lol/"+encodeURIComponent(a[0])+"-"+encodeURIComponent(a[1])}
function hue(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function avHtml(p){
  return '<span class="pav" style="--h:'+hue(p.name)+'">'+esc(String(p.name).slice(0,1).toUpperCase())
    + (p.avatar ? '<img alt="" loading="lazy" src="'+esc(p.avatar)+'" onerror="this.remove()">' : '') + '</span>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function setDates(){
  document.getElementById("d1").textContent = fmt(START);
  document.getElementById("d2").textContent = fmt(END);
  var now = new Date(), st = new Date(START+"T00:00:00"), e = new Date(END+"T23:59:59");   // heure locale, dernier jour inclus
  var el = document.getElementById("left");
  if(now < st) el.textContent = "Commence dans " + Math.ceil((st-now)/864e5) + " j";
  else if(now > e) el.textContent = "Challenge terminé";
  else el.textContent = Math.ceil((e-now)/864e5) + " j restants";
}
setDates();

function render(){
  var q = document.getElementById("q").value.toLowerCase().trim();
  var k = document.getElementById("sort").value;
  var f = {elo:score, games:games, wr:wr, wins:function(p){return p.w}}[k];
  var list = PLAYERS.slice().sort(function(a,b){return f(b)-f(a)});
  var html = "", n = 0;
  list.forEach(function(p,i){
    if(q && (p.name+" "+p.riot).toLowerCase().indexOf(q) < 0) return;
    n++;
    var t = TIERS.indexOf(p.tier), hi = t >= 7;
    var rankTxt = p.unranked ? "Non classé" : LBL[p.tier] + (hi ? "" : " " + ROM[p.div]);
    var last = "";
    for(var j=0;j<(p.champs?Math.min(10,p.champs.length):0);j++){
      var c = p.champs[j] || "?", r = p.last10[j] || "L";
      last += '<div class="ch '+(r==="W"?"w":"l")+'" title="'+esc(c)+' · '+(r==="W"?"Victoire":"Défaite")+'">'+(iconSrc(c)?'<img alt="'+esc(c)+'" src="'+iconSrc(c)+'" onerror="this.replaceWith(document.createTextNode(this.alt.slice(0,3)))">':esc(c.slice(0,3)))+'</div>';
    }
    if(!last) last='<span style="color:var(--mut)">—</span>';
    html += '<tr class="clk" tabindex="0" data-riot="'+esc(p.riot)+'"><td class="rk">'+(i+1)+'</td>'
      + '<td class="pl"><div class="pw">'+avHtml(p)+'<div><b>'+esc(p.name)+liveTag(p)+'</b><a href="'+opgg(p.riot)+'" target="_blank" rel="noopener">'+esc(p.riot)+'</a></div></div></td>'
      + '<td><div class="elo">'+emblem(p,hi)
      + '<div class="lp">'+rankTxt+'<small>'+(p.unranked?"—":p.lp+" LP")+'</small></div></div></td>'
      + '<td data-l="Matchs">'+games(p)+'</td><td class="v" data-l="Victoires">'+p.w+'</td><td class="d" data-l="Défaites">'+p.l+'</td>'
      + '<td class="wr" data-l="Winrate">'+wr(p)+'%</td><td><div class="last">'+last+'</div></td></tr>';
  });
  document.getElementById("rows").innerHTML = html;
  document.getElementById("none").hidden = n > 0;
}

// ====== Graphique d'évolution des LP ======
var HIST = {}, STATS = null, lastFocus = null;
function loadExtra(){
  fetch("data/history.json?t="+Date.now()).then(function(r){return r.ok?r.json():{}}).then(function(d){HIST=d}).catch(function(){});
  fetch("data/stats.json?t="+Date.now()).then(function(r){return r.ok?r.json():null}).then(function(d){STATS=d}).catch(function(){});
}
function cscore(t){var i=TIERS.indexOf(t[1]);return i>=7 ? 2800+t[3] : i*400+(4-t[2])*100+t[3]}
function scoreLabel(v){
  if(v>=2800) return v===2800 ? "Maître" : "M+ "+(v-2800)+" LP";
  var i=Math.floor(v/400), d=4-Math.floor((v%400)/100);
  return LBL[TIERS[i]]+" "+ROM[d];
}
function rankText(t){
  var hi = TIERS.indexOf(t[1]) >= 7;
  return LBL[t[1]] + (hi ? "" : " " + ROM[t[2]]) + " · " + t[3] + " LP";
}
function two(n){return (n<10?"0":"")+n}
function fmtT(sec, withHour){
  var d = new Date(sec*1000);
  return two(d.getDate())+"/"+two(d.getMonth()+1) + (withHour ? " "+two(d.getHours())+":"+two(d.getMinutes()) : "");
}
function delta(n){return (n>0?"+":n<0?"−":"")+Math.abs(n)}
function chartSvg(pts, color){
  var W=720,H=300,L=84,R=16,T=14,B=30, now=Math.floor(Date.now()/1000);
  var data = pts.slice(), last = data[data.length-1];
  if(now - last[0] > 60) data.push([now,last[1],last[2],last[3]]);
  var t0 = data[0][0], t1 = data[data.length-1][0]; if(t1 <= t0) t1 = t0 + 3600;
  var v = data.map(cscore), lo = Math.min.apply(null,v), hi = Math.max.apply(null,v);
  var pad = Math.max(40,(hi-lo)*.15); lo -= pad; hi += pad;
  if(hi-lo < 160){var c=(hi+lo)/2; lo=c-80; hi=c+80;}
  var X=function(t){return L+(t-t0)/(t1-t0)*(W-L-R)}, Y=function(s){return T+(hi-s)/(hi-lo)*(H-T-B)};
  var step=[100,200,400,800,1600,3200].filter(function(s){return (hi-lo)/s<=5})[0] || 3200;
  var out = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" id="csvg">';
  out += '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>';
  for(var g=Math.ceil(lo/step)*step; g<=hi; g+=step){
    out += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#233248" stroke-width="1"/>'
         + '<text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="11" fill="#8394ab">'+esc(scoreLabel(g))+'</text>';
  }
  var span = (t1-t0)/86400;
  for(var k=0;k<=4;k++){
    var tt = t0+(t1-t0)*k/4;
    out += '<text x="'+X(tt)+'" y="'+(H-8)+'" text-anchor="'+(k===0?"start":k===4?"end":"middle")+'" font-size="11" fill="#8394ab">'+fmtT(tt, span<2)+'</text>';
  }
  var line = data.map(function(d,i){return (i?"L":"M")+X(d[0]).toFixed(1)+" "+Y(v[i]).toFixed(1)}).join(" ");
  out += '<path d="'+line+' L'+X(t1).toFixed(1)+" "+(H-B)+' L'+X(t0).toFixed(1)+" "+(H-B)+' Z" fill="url(#cg)"/>';
  out += '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  var real = pts.length;
  if(real <= 80) pts.forEach(function(d,i){out += '<circle cx="'+X(d[0]).toFixed(1)+'" cy="'+Y(v[i]).toFixed(1)+'" r="3.5" fill="#0e141e" stroke="'+color+'" stroke-width="2"/>'});
  out += '<g id="cur" style="display:none"><line id="cl" y1="'+T+'" y2="'+(H-B)+'" stroke="#8394ab" stroke-dasharray="3 3"/><circle id="cc" r="5.5" fill="'+color+'" stroke="#0e141e" stroke-width="2"/></g>';
  out += '<rect id="cr" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent"/></svg>';
  return {svg: out, data: data, v: v, X: X, Y: Y, W: W, real: real};
}
function attachHover(m){
  var svg = document.getElementById("csvg"), tip = document.getElementById("mtip");
  var cur = svg.querySelector("#cur"), cl = svg.querySelector("#cl"), cc = svg.querySelector("#cc");
  function show(ev){
    var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * m.W, best = 0, bd = 1e9;
    m.data.forEach(function(d,i){var dd = Math.abs(m.X(d[0]) - x); if(dd < bd){bd = dd; best = i;}});
    var d = m.data[best], prev = best > 0 ? m.v[best-1] : null, dl = prev === null ? "" : "  (" + delta(m.v[best]-prev) + " LP)";
    cur.style.display = ""; cl.setAttribute("x1", m.X(d[0])); cl.setAttribute("x2", m.X(d[0]));
    cc.setAttribute("cx", m.X(d[0])); cc.setAttribute("cy", m.Y(m.v[best]));
    tip.innerHTML = '<span style="color:var(--mut)">'+fmtT(d[0],true)+'</span> · <b>'+esc(rankText(d))+'</b>'+(prev===null?"":' <span class="'+(m.v[best]>=prev?"up":"dn")+'">'+esc(dl)+'</span>');
  }
  var rect = svg.querySelector("#cr");
  rect.addEventListener("pointermove", show); rect.addEventListener("pointerdown", show);
  rect.addEventListener("pointerleave", function(){cur.style.display="none"; tip.innerHTML = "&nbsp;";});
}
function openPlayer(riot){
  var p = PLAYERS.filter(function(x){return x.riot === riot})[0]; if(!p) return;
  var pts = (HIST[riot] || []).slice().sort(function(a,b){return a[0]-b[0]});
  var hi = TIERS.indexOf(p.tier) >= 7, color = COL[p.tier] || "#f5c542";
  document.getElementById("mem").innerHTML = '<div class="pw">'+avHtml(p)+emblem(p,hi)+'</div>';
  document.getElementById("mt").textContent = p.name;
  document.getElementById("ms").textContent = p.riot + (p.unranked ? " · non classé" : " · " + LBL[p.tier] + (hi ? "" : " " + ROM[p.div]) + " · " + p.lp + " LP");
  var sum = "", chart = "", note = "";
  var st = STATS && STATS.players && STATS.players[riot];
  if(pts.length){
    var diff = cscore(pts[pts.length-1]) - cscore(pts[0]);
    var peak = pts.reduce(function(a,b){return cscore(b) > cscore(a) ? b : a});
    sum += '<div>Depuis le début du suivi<b class="'+(diff>=0?"up":"dn")+'">'+delta(diff)+' LP</b></div>'
         + '<div>Meilleur rang atteint<b>'+esc(rankText(peak))+'</b></div>';
  }
  if(st){
    sum += '<div>Parties du challenge<b>'+st.games+' · '+st.winrate+'%</b></div><div>KDA<b>'+st.kda+'</b></div>'
         + '<div>Série<b>'+(st.streak>0?"🔥 "+st.streak+" V":st.streak<0?"❄️ "+(-st.streak)+" D":"—")+'</b></div>';
  }
  document.getElementById("msum").innerHTML = sum;
  document.getElementById("mtip").innerHTML = "&nbsp;";
  var holder = document.getElementById("mchart"), model = null;
  if(pts.length){ model = chartSvg(pts, color); holder.innerHTML = model.svg; attachHover(model); }
  else holder.innerHTML = "";
  if(!pts.length) note = p.unranked ? "Ce joueur n'est pas encore classé en solo/duo : le graphique apparaîtra après sa première partie classée." : "Pas encore de données : le graphique se remplit à chaque changement de LP.";
  else if(pts.length === 1) note = "Un seul point pour l'instant : la courbe se dessine au fil des parties. Le suivi a commencé le " + fmtT(pts[0][0],true) + ".";
  else note = "Un point à chaque changement de LP, depuis le " + fmtT(pts[0][0],true) + " (début du suivi automatique). Passe la souris sur la courbe pour le détail.";
  document.getElementById("mnote").textContent = note;
  lastFocus = document.activeElement;
  document.getElementById("modal").hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("mx").focus();
}
function closePlayer(){
  document.getElementById("modal").hidden = true;
  document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("mx").addEventListener("click", closePlayer);
document.getElementById("modal").addEventListener("click", function(e){ if(e.target === this) closePlayer(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !document.getElementById("modal").hidden) closePlayer(); });
document.getElementById("rows").addEventListener("click", function(e){
  if(e.target.closest("a")) return;
  var tr = e.target.closest("tr[data-riot]"); if(tr) openPlayer(tr.getAttribute("data-riot"));
});
document.getElementById("rows").addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " ") return;
  var tr = e.target.closest("tr[data-riot]"); if(tr && e.target === tr){ e.preventDefault(); openPlayer(tr.getAttribute("data-riot")); }
});
document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
loadData();
loadExtra();
loadLive();
setInterval(loadLive, 60000);
loadDD();
</script>
