name: live-games

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes
  push:                      # dès que players.json change, mise à jour immédiate
    branches: [main]
    paths: ["players.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ranking      # même groupe que update.yml : jamais les deux en même temps
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python live.py
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      - name: Commit des données
        run: |
          git config user.name "soloq-bot"
          git config user.email "soloq-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "maj live"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
