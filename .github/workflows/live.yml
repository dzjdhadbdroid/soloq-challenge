name: live-games

on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub retarde souvent les tâches planifiées : chaque passage surveille ~25 min d'affilée
  push:                      # dès que players.json change, mise à jour immédiate
    branches: [main]
    paths: ["players.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-poll           # un seul suivi à la fois ; un nouveau remplace l'ancien
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Surveiller les parties en cours (environ 25 min, une vérification par minute)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          git config user.name "soloq-bot"
          git config user.email "soloq-bot@users.noreply.github.com"
          for i in $(seq 1 24); do
            python live.py || true
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "maj live"
              for k in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done
            fi
            sleep 60
          done
