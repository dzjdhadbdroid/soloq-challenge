name: update-ranking

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (GitHub peut retarder un peu)
  push:                      # dès que players.json change, mise à jour immédiate
    branches: [main]
    paths: ["players.json", "avatars/**"]
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update.py
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      - name: Commit des nouvelles données
        run: |
          git config user.name "soloq-bot"
          git config user.email "soloq-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "maj classement"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
